<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hakata</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#ffffff;--fg:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;
  --card:#f9fafb;--accent:#c9553a;--accent-hover:#b3442d;
  --btn-border:#d1d5db;--btn-bg:#ffffff;--btn-fg:#1a1a2e;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f0f17;--fg:#e5e7eb;--muted:#9ca3af;--border:#27272a;
    --card:#18181b;--accent:#e07058;--accent-hover:#c9553a;
    --btn-border:#3f3f46;--btn-bg:#18181b;--btn-fg:#e5e7eb;
  }
}
html,body{height:100%;overflow:hidden}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--fg);
  display:flex;align-items:center;justify-content:center;
}
.hero{text-align:center;padding:2rem;max-width:480px}
.hero img{
  width:96px;height:96px;margin-bottom:1.5rem;
  border-radius:20%;
}
.hero h1{font-size:2rem;font-weight:600;letter-spacing:-0.02em;margin-bottom:0.5rem}
.hero p{font-size:1rem;color:var(--muted);margin-bottom:2rem;line-height:1.5}
.btns{display:flex;gap:0.75rem;justify-content:center}
.btn{
  display:inline-flex;align-items:center;gap:0.5rem;
  padding:0.625rem 1.25rem;border-radius:6px;font-size:0.875rem;
  font-weight:500;text-decoration:none;transition:background 0.15s,border-color 0.15s;
}
.btn-primary{background:var(--accent);color:#fff;border:1px solid var(--accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-secondary{background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--btn-border)}
.btn-secondary:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px;fill:currentColor}
</style>
</head>
