[package]
name = "hakata"
version = "0.1.0"
edition = "2024"
description = "A tiny GPUI desktop app with a single centered button"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
libc = "0.2"
rust-i18n = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
ureq = "2"
zip = "2"
gpui = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = ["test-support"] }
gpui_platform = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = [
    "font-kit",
    "wayland",
    "x11",
] }

[profile.dev]
opt-level = 1

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
